name: ci

on:
  pull_request:
    branches: ["main"]
  # The merge queue's build of the tree that will land: `main`, the entries
  # ahead in the queue and this one. Every job runs ONLY there, as in
  # alexandria-web-application and claude-code-plugins. On `pull_request` each
  # job is skipped at job level, so a push to a pull request starts no runner,
  # and `quality_checks` reports the success the ruleset needs before the queue
  # accepts the pull request: GitHub requires the same checks to enter the
  # queue as the queue waits for, and offers no way to require them in one
  # place only. A green pull request means nothing has been checked yet.
  merge_group:
  # The standards index test with the model, by hand: to measure the index
  # before changing it, or after a change to the hook or a role's brief.
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases to run, comma-separated (empty: all)"
        required: false
        default: ""
      runs:
        description: "Runs per case"
        required: false
        default: "3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The checks run on the developers' machines, Linux and macOS, and read
    # the process table differently on each, so both run the tests.
    if: ${{ github.event_name == 'merge_group' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'checks/**/*.test.ts' 'evals/**/*.test.ts'

  # A standard added, or a scope («What Counts as») changed, owes the index
  # test its index entry and its cases in the same change; otherwise the test
  # with the model keeps passing on the cases of the old scope. Compared with
  # the queue's base, the `main` this change lands on.
  scope_changes:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node evals/index/scope-changes.ts "${{ github.event.merge_group.base_sha }}"

  # The standards index test with the model: an agent that read only the
  # index must choose every standard each case expects in most of 3 runs.
  # About 900,000 tokens a run, so in the queue it runs only when a standard
  # is added or removed or an index entry changes; otherwise the job passes
  # without calling the model. It authenticates with Workload Identity
  # Federation: GitHub's OIDC token is exchanged for a short-lived Anthropic
  # token of the service account `standards-index-test`, through the rule in
  # the repository variables; there is no API key to leak. If the exchange
  # fails, every run fails: a change to the index that nobody tested must not
  # land.
  index_model_test:
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/github-oidc-token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: needed
        if: ${{ github.event_name == 'merge_group' }}
        run: node evals/index/model-test-needed.ts "${{ github.event.merge_group.base_sha }}"
      - if: ${{ github.event_name == 'workflow_dispatch' || steps.needed.outputs.needed == 'true' }}
        run: npm ci
      - if: ${{ github.event_name == 'workflow_dispatch' || steps.needed.outputs.needed == 'true' }}
        # GitHub's token lasts about 5 minutes and each one is exchanged only
        # once, while the run takes longer: a fresh one is written every 2
        # minutes, and the SDK reads the file again on every refresh.
        run: |
          fetch_token() {
            curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch_token
          (while sleep 120; do fetch_token; done) &
          refresher=$!
          trap 'kill "$refresher"' EXIT
          node evals/index/run.ts --out evals/index/results/ci --runs "${RUNS:-3}" ${CASES:+--cases "$CASES"}
        env:
          CASES: ${{ inputs.cases }}
          RUNS: ${{ inputs.runs }}
      - if: ${{ always() && (github.event_name == 'workflow_dispatch' || steps.needed.outputs.needed == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: index-model-test
          path: evals/index/results/ci
          if-no-files-found: ignore

  # The one check the ruleset requires. It accepts only `success` from every
  # job it needs, so a skipped or cancelled job fails the queue's build. Adding
  # a job means adding it here, never to the ruleset.
  quality_checks:
    needs: [test, scope_changes, index_model_test]
    if: ${{ always() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
